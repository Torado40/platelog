<title>Plate Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-thumb mobile app — sticky date header, summary card, meal groups of steppable lines, bottom tab bar, bottom sheets for everything else. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#eaeee7; --ink:#17201b; --muted:#5c6861; --faint:#8c968f; --line:#dde3da;
  --accent:#b8611a; --accent-ink:#ffffff; --accent-soft:#f6e6d6;
  --good:#1f7a43; --warn:#a86a00; --bad:#c23b33; --bad-soft:#f8e1df; --good-soft:#dff0e4;
  --pro:#2a78d6; --carb:#eb6834; --fat:#1baf7a;
  --shadow:0 1px 2px rgba(23,32,27,.06),0 6px 24px rgba(23,32,27,.08);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201d; --surface-2:#252b27; --ink:#eef2ee; --muted:#a6b0a9; --faint:#78827b; --line:#2e3631;
  --accent:#e08a3c; --accent-ink:#1a120a; --accent-soft:#3a2a1b;
  --good:#5cc483; --warn:#e0a63a; --bad:#f07a70; --bad-soft:#3d2321; --good-soft:#1e3326;
  --pro:#3987e5; --carb:#d95926; --fat:#199e70; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --surface-2:#252b27; --ink:#eef2ee; --muted:#a6b0a9; --faint:#78827b; --line:#2e3631;
  --accent:#e08a3c; --accent-ink:#1a120a; --accent-soft:#3a2a1b;
  --good:#5cc483; --warn:#e0a63a; --bad:#f07a70; --bad-soft:#3d2321; --good-soft:#1e3326;
  --pro:#3987e5; --carb:#d95926; --fat:#199e70; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:26px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* summary */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.summary{padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font:700 26px/1 var(--f-display)}
.ring .small{font-size:11px;color:var(--muted);margin-top:3px}
.bars{display:grid;gap:9px;min-width:0}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar .lbl b{font-weight:600}
.track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:4px}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.stat{font-size:12px;border-radius:999px;padding:4px 9px;background:var(--surface-2);color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.stat.ok{background:var(--good-soft)} .stat.ok b{color:var(--good)}
.stat.over{background:var(--bad-soft)} .stat.over b{color:var(--bad)}
.remain{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;gap:8px;flex-wrap:wrap}
/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.toolbar .grow{flex:1}
/* meal groups */
.meal{margin-top:14px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.meal-h h2{font-size:17px}
.lines{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.line{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
.line .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.zero .nm{color:var(--muted);font-weight:500}
.line .kc{font-size:12px;color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.step button{width:38px;height:40px;border:0;background:var(--surface-2);font-size:20px;line-height:1;display:grid;place-items:center}
.step .val{min-width:44px;height:40px;border:0;background:var(--surface);text-align:center;font-weight:700;font-size:16px}
.line:not(.zero) .step .val{color:var(--accent)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 24px rgba(184,97,26,.35);padding:14px 22px;border-radius:999px;display:flex;gap:8px;align-items:center}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sheet-h h2{font-size:20px;flex:1;min-width:0}
.sheet-b{overflow:auto;padding:0 16px 18px;flex:1;min-height:0}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .pill{white-space:nowrap}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.row:first-child{border-top:0}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:12px;color:var(--muted);flex:none}
.row .r b{display:block;color:var(--ink);font-size:14px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.tag.ai{background:var(--accent-soft);color:var(--accent)}
.tag.lbl{background:var(--good-soft);color:var(--good)}
.tag.in{background:var(--ink);color:var(--bg)}
.sec-t{margin:16px 2px 0;display:flex;justify-content:space-between;align-items:center}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:600;text-align:center}
.act svg{width:22px;height:22px;color:var(--accent)}
/* forms */
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
label.f .est{color:var(--accent);font-weight:700}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--accent-soft)}
.banner.warn{background:var(--bad-soft)}
.banner.ok{background:var(--good-soft)}
.banner .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qgrid button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.qgrid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.thinking{display:flex;gap:10px;align-items:center;padding:24px 4px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;width:100%;text-align:left;margin-top:10px}
.cand .macros{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
/* history */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tile .v{font:700 24px/1.1 var(--f-display)}
.tile .s{font-size:12px;color:var(--muted)}
.chart{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px 8px;margin-top:12px;position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:8px 6px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:9px 6px;border-top:1px solid var(--line);text-align:right}
.tbl{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 8px;margin-top:10px;overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;font-weight:600;max-width:90%}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;margin-left:10px}
.offline{font-size:12px;color:var(--muted);text-align:center;padding:6px}
</style>

<script>
(() => {
'use strict';
const BUILD = window.__PL_BUILD || 'artifact';      // 'artifact' | 'standalone'
const STARTER = window.__PL_STARTER || null;        // {foods:{id:food}, settings} used when a device starts empty
// ---------- icons ----------
const I = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  plus:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',

  starOn:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.8z"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>'
};
// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = k => { const d = parseKey(k); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };
const fmtShort = k => { const d = parseKey(k); return d.getDate()+' '+MON[d.getMonth()]; };
const dayName = k => { const t = todayKey(); if (k===t) return 'Today'; if (k===addDays(t,-1)) return 'Yesterday'; return DOW[parseKey(k).getDay()]; };
const r0 = v => Math.round(v||0);
const r1 = v => { v = v||0; return Math.abs(v) >= 10 ? String(Math.round(v)) : String(Math.round(v*10)/10); };
const fmtServ = v => { v = +v||0; return Number.isInteger(v) ? String(v) : String(Math.round(v*100)/100); };
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48) || 'food';
const NUT = [
  {k:'cal', label:'Calories', unit:'kcal'},
  {k:'p', label:'Protein', unit:'g', color:'var(--pro)'},
  {k:'c', label:'Carbs', unit:'g', color:'var(--carb)'},
  {k:'f', label:'Fat', unit:'g', color:'var(--fat)'},
  {k:'fib', label:'Fiber', unit:'g', kind:'min'},
  {k:'sug', label:'Sugar', unit:'g', kind:'max'},
  {k:'sod', label:'Sodium', unit:'mg', kind:'max'}
];
const NKEYS = NUT.map(n => n.k);
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const guessMeal = () => { const h = new Date().getHours(); return h < 11 ? 'Breakfast' : h < 16 ? 'Lunch' : h < 21 ? 'Dinner' : 'Snacks'; };
const SRC_LABEL = {label:'Label', ai:'AI estimate', manual:'Manual', import:'Imported', web:'Website'};
const norm = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9؀-ۿ ]+/g,' ').replace(/\s+/g,' ').trim();
const STOP = new Set(['the','a','of','with','and','in','g','ml','1','piece','pack']);
const toks = s => norm(s).split(' ').filter(t => t && !STOP.has(t));
function similarity(a, b) {
  const A = new Set(toks(a)), B = new Set(toks(b));
  if (!A.size || !B.size) return 0;
  let inter = 0; A.forEach(t => { if (B.has(t)) inter++; });
  return 2*inter/(A.size+B.size);
}
function searchScore(food, q) {
  const hay = norm(food.name+' '+(food.brand||''));
  const qn = norm(q); if (!qn) return 0;
  if (hay.startsWith(qn)) return 100;
  if (hay.includes(qn)) return 80;
  const qt = qn.split(' '); let s = 0;
  for (const t of qt) { if (hay.split(' ').some(w => w.startsWith(t))) s += 30; else if (hay.includes(t)) s += 15; else if (t.length > 3 && fuzzyIn(t, hay)) s += 8; }
  return s / qt.length;
}
function fuzzyIn(t, hay) { // one typo tolerance against any word
  return hay.split(' ').some(w => w.length >= t.length-1 && lev(t, w.slice(0, t.length)) <= 1);
}
function lev(a, b) { const m = a.length, n = b.length; const d = Array.from({length:m+1}, (_, i) => [i]); for (let j=1;j<=n;j++) d[0][j]=j; for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function findDuplicate(name, brand, exceptId) {
  let best = null, bs = 0;
  for (const f of S.foods.values()) {
    if (f.id === exceptId) continue;
    let s = similarity(name+' '+(brand||''), f.name+' '+(f.brand||''));
    if (norm(f.name) === norm(name)) s = 1;
    if (s > bs) { bs = s; best = f; }
  }
  return bs >= 0.75 ? best : null;
}
function perServing(food) { const n = {}; NKEYS.forEach(k => n[k] = food[k] == null || food[k] === '' ? null : +food[k]); return n; }
function totals(items) {
  const t = {cal:0,p:0,c:0,f:0,fib:0,sug:0,sod:0,servings:0,count:0,sodMissing:false};
  for (const it of items) {
    const s = +it.servings || 0; if (s <= 0) continue;
    t.servings += s; t.count++;
    NKEYS.forEach(k => { const v = it.n?.[k]; if (v == null) { if (k==='sod') t.sodMissing = true; } else t[k] += v*s; });
  }
  return t;
}

// ---------- state ----------
const S = {
  tab: 'today', date: todayKey(),
  foods: new Map(), days: new Map(), settings: {targets:{cal:1850,p:130,c:200,f:55,fib:30,sug:50,sod:2300}, dropAfter:10},
  ready: {foods:false, days:false, settings:false}, mode: 'connecting',
  eatenOnly: false, histRange: 7, foodFilter: 'all', foodSort: 'az', foodQuery: '',
  dirty: new Map(), // dayKey -> timer
  sample: null, sampleImages: false
};
try { const v = JSON.parse(localStorage.getItem('pl-ui') || '{}'); if (v.eatenOnly != null) S.eatenOnly = v.eatenOnly; if (v.histRange) S.histRange = v.histRange; } catch {}
const saveUi = () => { try { localStorage.setItem('pl-ui', JSON.stringify({eatenOnly:S.eatenOnly, histRange:S.histRange})); } catch {} };

// ---------- store backends ----------
let store = null;
function dbStore(db) {
  const writing = new Map(); // path -> promise chain
  const chain = (path, fn) => { const p = (writing.get(path) || Promise.resolve()).then(fn, fn); writing.set(path, p.catch(() => {})); return p; };
  return {
    kind: 'db',
    start(on) {
      db.collection('foods').onSnapshot(s => on.foods(s.docs.map(d => ({id:d.id, ...d.data()})), s.metadata), e => on.error(e));
      db.collection('days').onSnapshot(s => on.days(s.docs.map(d => ({id:d.id, ...d.data()})), s.metadata), e => on.error(e));
      db.doc('config/settings').onSnapshot(d => on.settings(d.exists ? d.data() : null), e => on.error(e));
    },
    getDay: async k => { const d = await db.doc('days/'+k).get(); return d.exists ? {id:k, ...d.data()} : null; },
    saveFood: f => { const {id, ...rest} = f; return chain('foods/'+id, () => db.doc('foods/'+id).set(rest)); },
    deleteFood: id => chain('foods/'+id, () => db.doc('foods/'+id).delete()),
    saveDay: (k, doc) => chain('days/'+k, () => db.doc('days/'+k).set(doc)),
    saveSettings: s => chain('config/settings', () => db.doc('config/settings').set(s))
  };
}
function localStore() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem('pl-data')); } catch {}
  if (!data) { data = {foods: {...(STARTER?.foods || {})}, days: {}, settings: STARTER?.settings || null}; try { localStorage.setItem('pl-data', JSON.stringify(data)); } catch {} }
  let on = null;
  const persist = () => { try { localStorage.setItem('pl-data', JSON.stringify(data)); } catch {} };
  const emit = () => { on.foods(Object.entries(data.foods).map(([id,v]) => ({id,...v})), {fromCache:false}); on.days(Object.entries(data.days).map(([id,v]) => ({id,...v})), {fromCache:false}); on.settings(data.settings); };
  return {
    kind: 'local',
    start(o) { on = o; setTimeout(emit, 0); },
    getDay: async k => data.days[k] ? {id:k, ...data.days[k]} : null,
    saveFood: async f => { const {id,...rest} = f; data.foods[id] = rest; persist(); emit(); },
    deleteFood: async id => { delete data.foods[id]; persist(); emit(); },
    saveDay: async (k, doc) => { data.days[k] = doc; persist(); emit(); },
    saveSettings: async s => { data.settings = s; persist(); emit(); }
  };
}

// ---------- day logic ----------
function getDay(k) { return S.days.get(k) || null; }
function setDayItems(k, items) {
  const prev = S.days.get(k) || {date:k, items:[]};
  S.days.set(k, {...prev, date:k, items});
  scheduleSave(k);
  render();
}
function scheduleSave(k) {
  clearTimeout(S.dirty.get(k));
  S.dirty.set(k, setTimeout(() => flushDay(k), 450));
}
async function flushDay(k) {
  const doc = S.days.get(k); if (!doc) return;
  try { await store.saveDay(k, {date:k, items:doc.items, updatedAt:new Date().toISOString()}); }
  catch (e) { toast(e?.code === 'quota_exceeded' ? 'Storage is full. Delete old foods to free space.' : 'Could not save. Check your connection.'); }
  finally { S.dirty.delete(k); }
}
function previousLoggedDay(k) {
  const keys = [...S.days.keys()].filter(x => x < k && (S.days.get(x).items||[]).length).sort();
  return keys.length ? keys[keys.length-1] : null;
}
function buildFromPrevious(k) {
  const prevK = previousLoggedDay(k); if (!prevK) return [];
  const prev = S.days.get(prevK).items || [];
  const N = +S.settings.dropAfter || 0;
  let keep = () => true;
  if (N > 0) {
    const eaten = new Set();
    for (const [dk, d] of S.days) if (dk < k && dk >= addDays(k, -N)) (d.items||[]).forEach(it => { if (+it.servings > 0) eaten.add(it.foodId); });
    // keep lines eaten within the window; if the window has no data at all, keep everything
    if (eaten.size) keep = it => eaten.has(it.foodId) || S.foods.get(it.foodId)?.fav;
  }
  const seen = new Set();
  return prev.filter(keep).filter(it => { const key = it.foodId+'|'+it.meal; if (seen.has(key)) return false; seen.add(key); return true; })
    .map(it => { const f = S.foods.get(it.foodId); return {id:uid(), foodId:it.foodId, name:f?.name||it.name, brand:f?.brand||it.brand||'', portion:f?.portion||it.portion, meal:it.meal, servings:0, n: f ? perServing(f) : it.n}; });
}
let ensured = false;
async function ensureToday() {
  if (ensured || !S.ready.days || !S.ready.foods || !S.ready.settings) return;
  ensured = true;
  const k = todayKey();
  if (S.days.has(k)) return;
  // never overwrite a day that exists on the server but hasn't arrived yet
  try { const remote = await store.getDay(k); if (remote) { S.days.set(k, remote); render(); return; } } catch { ensured = false; return; }
  if (S.days.has(k)) return;
  const items = buildFromPrevious(k); if (items.length) { S.days.set(k, {date:k, items}); scheduleSave(k); }
  render();
}
// roll over at midnight if the app stays open
setInterval(() => { const k = todayKey(); if (!S.days.has(k) && ensured) { ensured = false; if (S.date === addDays(k,-1)) S.date = k; ensureToday(); } }, 60000);

function addItemToDay(k, food, meal, servings = 1) {
  const day = getDay(k); const items = [...(day?.items || [])];
  const ex = items.find(it => it.foodId === food.id && it.meal === meal);
  if (ex) { ex.servings = Math.round(((+ex.servings||0) + servings)*100)/100; }
  else items.push({id:uid(), foodId:food.id, name:food.name, brand:food.brand||'', portion:food.portion, meal, servings, n:perServing(food)});
  setDayItems(k, items);
  touchFood(food.id);
}
function touchFood(id) { /* usage computed from days; nothing to persist */ }
function usage() { // foodId -> {days, servings, last}
  const u = new Map();
  for (const [k, d] of S.days) for (const it of d.items||[]) { if (!(+it.servings > 0)) continue; const x = u.get(it.foodId) || {days:0, servings:0, last:''}; x.days++; x.servings += +it.servings; if (k > x.last) x.last = k; u.set(it.foodId, x); }
  return u;
}

// ---------- rendering ----------
function render() {
  renderTabs();
  const app = $('#app');
  if (S.tab === 'today') app.innerHTML = viewToday();
  else if (S.tab === 'history') app.innerHTML = viewHistory();
  else if (S.tab === 'foods') app.innerHTML = viewFoods();
  else app.innerHTML = viewSettings();
  if (S.tab === 'history') wireChart();
  if (S.tab === 'foods') { const q = $('#food-q'); if (q && S._refocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); S._refocus = false; } }
}
function renderTabs() {
  const t = [['today','Log',I.today],['history','History',I.hist],['foods','Foods',I.foods],['settings','Targets',I.gear]];
  $('#tabs').innerHTML = t.map(([id,l,ic]) => `<button data-act="tab" data-v="${id}" class="${S.tab===id?'on':''}" aria-current="${S.tab===id?'page':'false'}">${ic}<span>${l}</span></button>`).join('');
}
function ring(val, target) {

function readEditor() {
  const v = id => $('#e-'+id)?.value ?? '';
  const num = k => { const x = v(k).trim(); return x === '' ? null : Math.round(parseFloat(x)*100)/100; };
  const out = {name: v('name').trim(), brand: v('brand').trim(), portion: v('portion').trim(), source: v('source').trim(), sourceType: v('stype'), note: v('note').trim(), fav: $('#e-fav').checked, est: [...S._edit.est]};
  NKEYS.forEach(k => out[k] = num(k));

}
async function saveEditor() {
  const d = readEditor();
  if (!d.name || !d.portion || d.cal == null) { toast('Add a name, serving size and calories.'); return; }
  const E = S._edit;
  let id = E.mergeInto || E.orig.id;
  if (!id) { id = slug(d.name + (d.brand ? '-'+d.brand : '')); if (S.foods.has(id)) id += '-' + uid().slice(0,4); }
  const food = {...(S.foods.get(id) || {}), ...d, id, updatedAt: new Date().toISOString()};
  if (E.orig.grams) food.grams = E.orig.grams;
  S.foods.set(id, food);
  try { await store.saveFood(food); } catch { toast('Could not save the food. Try again.'); return; }
  // refresh macros on today's (and the open day's) lines that use this food
  for (const k of new Set([todayKey(), S.date])) {
    const day = getDay(k); if (!day) continue;
    if (day.items.some(i => i.foodId === id)) setDayItems(k, day.items.map(i => i.foodId === id ? {...i, name: food.name, brand: food.brand, portion: food.portion, n: perServing(food)} : i));
  }
  closeSheet();
  if (E.fromAdd) { addItemToDay(S.date, food, S._addMeal || guessMeal(), 1); toast(`Logged 1 × ${food.name}`); S.tab = 'today'; }
  else toast(E.isNew ? 'Food saved' : 'Food updated');
  render();
}

// ---------- AI ----------
function sampleErr(e) {
  const c = e?.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return 'Claude isn’t allowed for this app. Enter the food manually instead.';
  if (c === 'rate_limited') return 'Too many requests right now. Try again in a minute.';
  if (c === 'image_rejected') return 'That image couldn’t be read. Try a clearer photo (JPG or PNG).';
  if (c === 'refused') return 'Claude couldn’t help with that one. Try different wording.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'The answer came back incomplete. Try again.';
  if (c === 'cancelled') return '';
  if (c === 'bad_key') return 'The API key was rejected. Check it in Targets → AI features.';
  if (c === 'bad_request') return 'The AI request was refused' + (e.message ? ': ' + e.message : '.') + ' Check the model name in Targets → AI features.';
  return 'Something went wrong reaching Claude. Try again.';
}
const foodIndex = () => [...S.foods.values()].map(f => `${f.id} | ${f.name}${f.brand ? ' | '+f.brand : ''} | ${f.portion}`).join('\n');
const SRC_RULES = `Source priority: (1) the manufacturer's nutrition label for branded products (including Egyptian/MENA market versions), (2) USDA FoodData Central or national food-composition tables (e.g. Egypt NNI) for generic foods, (3) other reputable databases. When sources disagree, compare them and pick the most representative value for how the food is usually eaten in Egypt, and say briefly why. Be realistic about cooking oil and portion size. Sodium in mg; everything else in grams except calories (kcal). Numbers only.`;
const webNote = () => S.webSearch ? ' Use web search to check the manufacturer page, USDA FoodData Central or other reputable sources before answering, and put the site names you relied on in "source".' : '';
let aiCtl = null;
function thinkingHtml(msg) { return `<div class="thinking"><span class="dot"></span><span>${esc(msg)}</span></div><button class="btn block" data-act="aistop">Stop</button>`; }
function openAiLookup(q = '') {
  if (!S.sample) { toast('AI lookup isn’t available here. Enter the food manually.'); return openEditor({name:q}, {fromAdd: S._fromAdd}); }
  const body = `<form id="ai-form"><input id="ai-q" class="search" placeholder="e.g. Grilled chicken thigh, Juhayna Hi-Pro" value="${esc(q)}" autocomplete="off" aria-label="Food to look up"></form>
   <p class="muted" style="font-size:13px">Claude finds the most reliable nutrition values for generic foods or branded products, compares sources, and lets you review before saving.</p>
   <div id="ai-out"></div>`;
  openSheet('Look up a food', body, `<button class="btn primary" data-act="airun">Look up</button>`, {onClose: () => aiCtl?.abort()});
  $('#ai-form').addEventListener('submit', e => { e.preventDefault(); runLookup(); });
  if (q) runLookup(); else setTimeout(() => $('#ai-q').focus(), 60);
}
async function runLookup() {
  const q = $('#ai-q').value.trim(); if (!q) return;
  const out = $('#ai-out'); out.innerHTML = thinkingHtml('Researching “'+q+'”… this can take up to a minute');
  aiCtl?.abort(); aiCtl = new AbortController();
  const prompt = `You are a careful nutrition-data researcher helping someone in Cairo, Egypt build a personal food database.
Food to look up: "${q}"
${SRC_RULES}${webNote()}
Give up to 3 candidate interpretations (different products, preparations or serving sizes), best match first. Use a practical serving size the person would actually log (e.g. "1 medium thigh, skinless (~100 g cooked)", "1 bar (40 g)", "100 g").
Their existing foods (id | name | brand | serving), to detect duplicates:
${foodIndex()}
If a candidate is the same food as an existing one, set matchId to that id, else null.
Reply with only JSON: {"candidates":[{"name":"","brand":"","portion":"","cal":0,"p":0,"c":0,"f":0,"fib":0,"sug":0,"sod":0,"source":"short description of the source(s) the values are based on","confidence":"high|medium|low","why":"one sentence on why this value was chosen","matchId":null}]}`;
  try {
    const res = await S.sample.json(prompt, {signal: aiCtl.signal, cache: {gcTime: 600000}});

      <div class="muted" style="font-size:13px">${esc(c.portion)}</div>
      <div class="macros num"><b>${r0(c.cal)} kcal</b><span>${r1(c.p)} P</span><span>${r1(c.c)} C</span><span>${r1(c.f)} F</span><span class="muted">${r1(c.fib)} fib · ${r1(c.sug)} sug · ${r0(c.sod)} mg Na</span></div>
      <div class="muted" style="font-size:12px">${esc(c.source||'')}${c.why ? ' — '+esc(c.why) : ''}</div>
      ${c.matchId && S.foods.has(c.matchId) ? `<div style="font-size:12px;color:var(--bad);font-weight:600">Already saved as “${esc(S.foods.get(c.matchId).name)}”</div>` : ''}
    </button>`).join('');
  } catch (e) { const m = sampleErr(e); out.innerHTML = m ? `<div class="banner warn">${esc(m)}</div>` : ''; }
}
function pickCandidate(i) {

  const d = readEditor(); const out = $('#aicheck-out'); out.innerHTML = thinkingHtml('Checking these values…');

  const prompt = `Check this saved food entry for accuracy for someone in Egypt.
${JSON.stringify({name:d.name, brand:d.brand, portion:d.portion, cal:d.cal, p:d.p, c:d.c, f:d.f, fib:d.fib, sug:d.sug, sod:d.sod})}
${SRC_RULES}

  try {
    const r = await S.sample.json(prompt, {signal: aiCtl.signal});
    const sg = r?.suggested || {}; const changes = NKEYS.filter(k => sg[k] != null && (d[k] == null || Math.abs(+sg[k] - d[k]) > Math.max(1, Math.abs(d[k])*0.1)));

}
async function fillMissing() {

  openSheet('Fill missing values', thinkingHtml(`Estimating gaps for ${missing.length} foods… up to a minute`), '', {onClose: () => aiCtl?.abort()});
  aiCtl?.abort(); aiCtl = new AbortController();
  const lines = missing.map(f => JSON.stringify({id:f.id, name:f.name, brand:f.brand, portion:f.portion, cal:f.cal, p:f.p, c:f.c, f:f.f, fib:f.fib, sug:f.sug, sod:f.sod})).join('\n');
  const prompt = `These foods (one JSON per line) have null nutrition fields. For each, estimate ONLY the null fields for the stated serving. ${SRC_RULES}
${lines}
Reply with only JSON: {"items":[{"id":"","values":{"<only the null keys>":0}}]}`;
  try {
    const r = await S.sample.json(prompt, {signal: aiCtl.signal, modelTier: 'default'});
    const items = (r?.items || []).filter(x => S.foods.has(x.id) && x.values);

    $('#sheet-b').innerHTML = `<p class="muted" style="margin-top:0">Estimated values, marked “AI” on each food. Nothing is saved until you apply.</p><div class="list">${items.map(x => { const f = S.foods.get(x.id); return `<div class="row"><div class="info"><div class="nm">${esc(f.name)}</div><div class="meta num">${Object.entries(x.values).filter(([k,v]) => NKEYS.includes(k) && v != null).map(([k,v]) => `${NUT.find(n=>n.k===k).label} ${v}${NUT.find(n=>n.k===k).unit==='mg'?' mg':' g'}`).join(' · ')}</div></div></div>`; }).join('')}</div>`;
    $('#sheet-root .sheet').insertAdjacentHTML('beforeend', `<div class="sheet-f"><button class="btn" data-act="closesheet">Cancel</button><button class="btn primary" data-act="applyfill">Apply to ${items.length} foods</button></div>`);
  } catch (e) { const m = sampleErr(e); $('#sheet-b').innerHTML = m ? `<div class="banner warn">${esc(m)}</div>` : ''; }
}
async function applyFill() {
  const items = S._fill || []; let n = 0;
  for (const x of items) {
    const f = {...S.foods.get(x.id)}; const est = new Set(f.est || []);
    for (const [k, v] of Object.entries(x.values)) if (NKEYS.includes(k) && v != null && (f[k] == null || f[k] === '')) { f[k] = +v; est.add(k); }
    f.est = [...est]; f.updatedAt = new Date().toISOString();
    if (!/AI estimate/.test(f.source||'')) f.source = (f.source ? f.source + ' · ' : '') + 'AI estimate for missing fields';
    S.foods.set(f.id, f);
    try { await store.saveFood(f); n++; } catch {}
  }
  const k = todayKey(), day = getDay(k);
  if (day) setDayItems(k, day.items.map(i => S.foods.has(i.foodId) ? {...i, n: perServing(S.foods.get(i.foodId))} : i));
  closeSheet(); toast(`Updated ${n} foods`); render();
}

async function doExport(kind) {

  let rows;
  if (kind === 'foods') rows = [['Food','Brand','Serving','Calories','Protein','Carbs','Fat','Fiber','Sugar','Sodium mg','Source type','Source','Updated','Favorite']].concat([...S.foods.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(f => [f.name,f.brand,f.portion,f.cal,f.p,f.c,f.f,f.fib,f.sug,f.sod,SRC_LABEL[f.sourceType]||'',f.source,(f.updatedAt||'').slice(0,10),f.fav?'yes':'']));
  else { rows = [['Date','Meal','Food','Servings','Serving size','Calories','Protein','Carbs','Fat','Fiber','Sugar','Sodium mg']];

    const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) { try { await dl.save({filename, data}); return; } catch (e) { if (e?.code !== 'not_granted' && e?.code !== 'capability_disabled') { toast('Download was cancelled.'); return; } } }
  }

async function mergeFoods(keepId, dropId) {
  const keep = S.foods.get(keepId), drop = S.foods.get(dropId); if (!keep || !drop) return;
  for (const k of [todayKey(), S.date]) { const day = getDay(k); if (day && day.items.some(i => i.foodId === dropId)) setDayItems(k, day.items.map(i => i.foodId === dropId ? {...i, foodId: keepId, name: keep.name, brand: keep.brand, portion: keep.portion, n: perServing(keep)} : i)); }
  // re-point history so usage stats stay together (numbers in past days are kept as logged)
  for (const [k, d] of S.days) if (k !== todayKey() && k !== S.date && (d.items||[]).some(i => i.foodId === dropId)) setDayItems(k, d.items.map(i => i.foodId === dropId ? {...i, foodId: keepId} : i));
  S.foods.delete(dropId); try { await store.deleteFood(dropId); } catch {}
  toast(`Merged into ${keep.name}`); render();
}

function shrinkImage(file) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const m = 1568, k = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]); URL.revokeObjectURL(img.src); }; img.onerror = () => res(null); img.src = URL.createObjectURL(file); });
}
function parseJsonLoose(t) {
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const i = Math.min(...['{','['].map(ch => { const x = t.indexOf(ch); return x < 0 ? Infinity : x; })), j = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (i < j) { try { return JSON.parse(t.slice(i, j+1)); } catch {} }
  throw {code:'invalid_json'};
}
function setupStandaloneAI() {
  const c = aiConf();
  if (!c.key) { S.sample = null; S.sampleImages = false; S.webSearch = false; return; }
  S.webSearch = c.web !== false;
  const call = async (prompt, opts = {}) => {
    const content = [];
    for (const f of [...(opts.images || [])]) { const d = await shrinkImage(f); if (d) content.push({type:'image', source:{type:'base64', media_type:'image/jpeg', data:d}}); }
    content.push({type:'text', text: prompt + '\n\nYour final message must be only the JSON.'});
    const body = {model: c.model || DEFAULT_MODEL, max_tokens: 4000, messages: [{role:'user', content}]};
    if (S.webSearch) body.tools = [{type:'web_search_20250305', name:'web_search', max_uses:4}];
    let r;
    try { r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal: opts.signal, headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body: JSON.stringify(body)}); }
    catch (e) { throw {code: e?.name === 'AbortError' ? 'cancelled' : 'upstream_error'}; }
    if (r.status === 401 || r.status === 403) throw {code:'bad_key'};
    if (r.status === 429) throw {code:'rate_limited'};
    if (r.status === 404 || r.status === 400) { let m = ''; try { m = (await r.json())?.error?.message || ''; } catch {} throw {code:'bad_request', message:m}; }
    if (!r.ok) throw {code:'upstream_error'};
    const j = await r.json();
    const texts = (j.content || []).filter(b => b.type === 'text').map(b => b.text);
    return parseJsonLoose(texts[texts.length-1] || texts.join('\n'));
  };
  S.sample = {json: call, limits: async () => ({images:{maxCount:3}})};
  S.sampleImages = {maxCount:3};
}

// ---------- boot ----------
function startStore(st) {
  store = st; S.mode = st.kind;
  st.start({
    foods(list, meta) { S.foods = new Map(list.map(f => [f.id, f])); if (!meta?.fromCache) S.ready.foods = true; ensureToday(); if (!$('#sheet-root').innerHTML || S.tab !== 'today') render(); else render(); },
    days(list, meta) {
      for (const d of list) if (!S.dirty.has(d.id)) S.days.set(d.id, d);
      const ids = new Set(list.map(d => d.id)); for (const k of [...S.days.keys()]) if (!ids.has(k) && !S.dirty.has(k) && !meta?.fromCache) S.days.delete(k);
      if (!meta?.fromCache) S.ready.days = true; ensureToday(); render();
    },
    settings(s) { if (s) S.settings = {...S.settings, ...s, targets: {...S.settings.targets, ...(s.targets||{})}}; S.ready.settings = true; ensureToday(); render(); },
    error(e) { if (e?.code === 'revoked') toast('Access to your data changed. Reload the page.'); }
  });
  setTimeout(() => { S.ready.days = S.ready.foods = S.ready.settings = true; ensureToday(); render(); }, 6000);
}
render();
(async () => {
  if (BUILD === 'standalone') { startStore(localStore()); setupStandaloneAI(); render(); return; }
  const c = window.claude;
  const db = c?.use ? await c.use('db').catch(() => null) : null;
  // only the owner uses the synced log; anyone else (or a signed-out visitor) gets their own copy on their device
  let owner = false;
  if (db) { const u = await c.use('user').catch(() => null); owner = u ? await u.isOwner().catch(() => false) : true; }
  startStore(db && owner ? dbStore(db) : localStore());
  const sm = c?.use ? await c.use('sample').catch(() => null) : null;
  if (sm) { S.sample = sm; try { const lim = await sm.limits(); S.sampleImages = lim?.images || false; } catch { S.sampleImages = false; } render(); }
})();
})();
</script>
